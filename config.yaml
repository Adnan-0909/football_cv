# =====================================================================
# Football Tactical Analysis Configuration
# =====================================================================

# Model settings for object detection
model:
  # Path to YOLO model weights (e.g. yolov8s.pt, yolov8n.pt, yolov8x.pt, or custom trained weights)
  # Missing weights are downloaded automatically on first run.
  weights_path: "models/yolov8s.pt"
  # Minimum confidence for detections that are DRAWN / reported (HUD count,
  # ball marker). Kept separate from the tracker's candidate floor below.
  confidence_threshold: 0.35
  # Inference resolution for YOLO. 0 = auto: source frame width rounded down
  # to a multiple of 32 (at least 640). The previous implicit default was
  # Ultralytics' 640, which processes 1280-wide broadcast frames at half
  # resolution and loses distant players.
  imgsz: 0
  # Detections at/above this confidence are produced as *candidates* for the
  # tracker even when below confidence_threshold. Keep it at ByteTrack's
  # track_low_thresh (0.1) so the low-score rescue stage can re-associate
  # players through short occlusions; new tracks still require
  # tracker.new_track_thresh (0.6), so crowd false positives cannot spawn IDs.
  candidate_threshold: 0.10
  # Non-Maximum Suppression (IoU) threshold
  iou_threshold: 0.5
  # Hardware device: "cpu", "cuda", or "0" for GPU
  device: "cpu"
  # Target class IDs in standard COCO dataset (0 = person, 32 = sports ball)
  player_class_id: 0
  ball_class_id: 32

# Video I/O configuration
video:
  # Path to input video file (relative to project root or absolute)
  input_path: "input/match_sample.mp4"
  # Path for output annotated video
  output_path: "output/tactical_analysis.mp4"
  # Maximum frames to process (null for entire video)
  max_frames: null
  # Frame stride: process every Nth frame (1 = every frame)
  frame_stride: 1

# Player tracking configuration (ByteTrack)
tracker:
  # Tracking backend: "bytetrack" (Ultralytics' built-in Kalman-filtered
  # ByteTrack, requires the 'lap' package) or "bytetrack_lite" (dependency-free
  # NumPy fallback with identical behaviour).
  tracker_type: "bytetrack"
  # Detections at/above this confidence drive stage-1 matching
  track_high_thresh: 0.5
  # Detections below this confidence are ignored entirely
  track_low_thresh: 0.1
  # Confidence required to start a new track (lower to 0.45 if few players get IDs)
  new_track_thresh: 0.6
  # Number of frames to keep lost tracks alive before they are discarded
  track_buffer: 30
  # Maximum assignment cost (1 - IoU * confidence) in stage 1
  match_thresh: 0.8
  # Only track players: the ball is still detected and drawn, but never gets a
  # track ID (its tiny size makes IoU-based IDs flicker).
  player_only: true

# Team classification configuration (Stage 3 - jersey colour clustering)
# Teams are discovered from the footage itself: no fixed RGB values and no
# "blue = Team A" rule. Players the system cannot separate confidently
# (referees, goalkeepers, very similar kits) are reported as UNKNOWN.
team_classifier:
  # Number of clusters: 2 outfield teams
  n_teams: 2
  # Upper-body (torso) crop inside each player bounding box, as fractions of
  # the box. This is what keeps grass, legs and most background out of the
  # colour sample.
  torso_crop_top: 0.25
  torso_crop_bottom: 0.55
  # Columns trimmed on each side of the box (arms / background bleeding in)
  torso_crop_side: 0.20

  # --- dominant jersey colour extraction --- #
  # Pixel clusters used to find the crop's dominant colour region
  n_dominant_colors: 3
  # Crops smaller than this many pixels are ignored (far-away players)
  min_crop_pixels: 40
  # Large crops are subsampled to this many pixels (constant cost per player)
  max_crop_pixels: 512
  # The dominant region must cover at least this share of the crop, otherwise
  # the observation is rejected (occlusion, advertisement boards in the box).
  min_dominant_ratio: 0.35
  # Weight of brightness (V) in the colour feature: lower = more robust to
  # shadows, higher = better white-vs-black kit separation
  value_weight: 0.8
  # Lloyd iterations for the per-crop dominant colour
  pixel_kmeans_iters: 6

  # --- two-team clustering --- #
  # Frames between colour-model refits (keeps TEAM_A/TEAM_B meanings stable)
  recluster_interval: 15
  # Pooled observations / distinct players required before the first fit.
  # The pooled features are only *evidence* that fitting may be attempted:
  # the clustering itself runs on one vote per player (the median of their
  # recent features), so a single bad frame cannot drag a player's colour.
  min_cluster_samples: 40
  min_cluster_tracks: 4
  # Caps keeping clustering cheap
  max_cluster_samples: 4000
  # Recent features per player that one vote is the median of
  max_samples_per_track: 12
  # A player only votes in a fit once they have at least this many
  # observations: the first boxes of a new track sit on grass/background, so
  # an immature median would poison the very first models (the old pipeline
  # fitted at frame 3 on such garbage).
  min_vote_features: 6
  # k-means effort for the team clustering itself
  kmeans_iters: 25
  kmeans_restarts: 3
  # Clusters closer than this multiple of their own spread count as one blob
  # (similar kits) -> no model, everyone stays UNKNOWN instead of being split
  # arbitrarily. Kept at 2.0 for this footage: distant-camera shots separate
  # white-vs-navy by ~2.2-2.8 robust spreads (a code default of 3.0 stays in
  # TeamClassifierConfig for cleaner sources).
  min_separation_ratio: 2.0
  # Minimum absolute distance between the two cluster centres in feature
  # space. The ratio gate above is scale-free: two halves of ONE kit are
  # tight, so their radii are tiny and even a 0.03-0.09 gap clears it - the
  # fits then label bright vs dim white as two teams. This floor rejects
  # sub-splits (observed <= 0.09) while genuine kit pairs here are >= 0.11.
  min_separation_distance: 0.10
  # Per-cluster radius floor as a fraction of the cluster separation
  radius_floor_ratio: 0.05
  # Smallest share of votes any team cluster may hold. A split whose minority
  # is smaller than this found outliers, not teams - e.g. a lone referee or
  # grass-dominated players form one cluster while both real kits merge into
  # the other. Such clusters are pruned and the fit retried (up to two
  # prunes); if still degenerate the fit is refused instead of labelling the
  # whole pitch TEAM_A. Real footage carries 2-4 outlier votes among 10-16
  # players (~15-25%), so 0.15 failed to prune them; 0.25 prunes the junk
  # while a genuine small side (>= a quarter of the votes) still counts.
  min_minority_share: 0.25

  # --- assignment + temporal smoothing --- #
  # Rolling observation window kept per player
  feature_history: 32
  # Recent observations averaged when deciding the current team
  mean_window: 10
  # Uncertainty gates (relative to the clustered data, not fixed colours):
  #   radius - too far from the nearest team -> UNKNOWN (referee, goalkeeper,
  #           odd kit, advertisement colour)
  #   margin - almost equally close to both teams -> UNKNOWN (similar kits)
  # Raise the radius scale to label more players, lower it to be stricter.
  unknown_radius_scale: 2.5
  unknown_margin_ratio: 0.75
  # Consecutive agreeing frames before a team is committed to a player, and
  # consecutive contradicting frames before it may be switched. Higher values
  # = more stable IDs, slower to react.
  min_consistent_frames: 2
  switch_frames: 12
  # Seed for the clustering (deterministic output for a given clip)
  random_seed: 0

# 2D Pitch mapping configuration (Stage 4, standard FIFA pitch dimensions)
# Coordinate system (meters): origin (0,0) at the bottom-left pitch corner,
# x along the length 0 -> 105, y along the width 0 -> 68. See app/pitch.py.
pitch:
  length_meters: 105.0
  width_meters: 68.0
  # Manual calibration file (image <-> pitch correspondences for the video
  # you are processing). The pitch stage only runs when this file exists -
  # create it with: python main.py --calibrate
  calibration_path: "calibration/pitch.json"
  # Minimum number of image/pitch point pairs accepted by findHomography().
  min_points: 4
  # Draw the top-down radar inset on the annotated video (needs calibration).
  show_radar: true

# Stage 6 (formation) + Stage 7 (teammate graph) tactical analysis.
# Both run per frame inside the --stage5 side-by-side output.
tactics:
  # Frames averaged when deciding the displayed formation (temporal window);
  # higher = slower but much more stable labels.
  formation_window: 10
  # Smoothed confidence below this -> formation is shown as UNKNOWN.
  formation_min_confidence: 0.6
  # Stage 7: teammates further apart than this (meters) are never linked,
  # no matter how many neighbours they have. Lower = sparser, tighter mesh.
  max_connection_distance: 25.0
  # Stage 7: each player links to at most its k nearest teammates inside the
  # distance cap - keeps the graph from becoming fully connected.
  connection_k_neighbors: 3
  # Stage 7: an existing edge survives up to max_connection_distance * (1 + ratio)
  # before dropping. Hysteresis stops edges flickering as players hover at the cap.
  edge_hysteresis_ratio: 0.15

# Logging configuration
logging:
  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  # Log message format
  format: "[%(asctime)s] [%(levelname)s] [%(name)s]: %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
